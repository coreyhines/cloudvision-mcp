# Install commit + push hooks (gitleaks on staged files AND on push):
#   uv sync --dev && pre-commit install --hook-type pre-commit --hook-type pre-push
# Manual: pre-commit run --all-files
#
# Do not pass --log-opts main: that makes gitleaks scan `main` instead of the
# staged commit, so secrets on a feature branch would slip through locally.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: [--config=.gitleaks.toml]
        stages: [pre-commit, pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: name-tests-test
        args: [--pytest-test-first]

  - repo: local
    hooks:
      # ``uv run`` re-syncs the editable install on every invocation. Without
      # require_serial, pre-commit runs several file batches concurrently and
      # they race on the same dist-info (flaky "failed to remove directory"
      # exit 2). One invocation per hook, all files at once.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        require_serial: true
      - id: black
        name: black
        entry: uv run black
        language: system
        require_serial: true
        types: [python]
