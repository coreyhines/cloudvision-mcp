[project]
name = "cvp_mcp"
version = "0.1.0"
description = "CloudVision MCP Server"
requires-python = ">=3.11"
dependencies = [
    # 1.34.0 ships configstatus without services/ (breaks Resource API stubs).
    # 1.33.0 still has services and requires cryptography>=50.
    "cloudvision>=1.33,<1.34",
    "aiohttp>=3.9",
    "grpcio>=1.60",
    "protobuf>=4.25",
    "mcp[cli]>=1.29.1,<2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "black>=24.0",
    "pre-commit>=4.0",
]

# Security floors for transitive deps (see Dependabot alerts).
# cryptography>=50 comes via cloudvision 1.33 (avoid 1.34.0; missing services).
[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2",
    "aiohttp>=3.14.3",
    "cryptography>=50.0.0,<51",
    "h2>=4.4.1",
    "hpack>=4.2.0",
    "msgpack>=1.2.2",
    "python-multipart>=0.0.32",
    "starlette>=1.7.0",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cvp_mcp", "cvp_mcp.grpc", "cvp_mcp.members"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
extend-ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"cvp_mcp/grpc/__init__.py" = ["F401"]

[tool.black]
line-length = 88
target-version = ["py311"]
